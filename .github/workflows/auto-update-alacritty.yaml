name: Update Alacritty cask

on:
  schedule:
    - cron: "0 20 * * 0"
  workflow_dispatch:

concurrency:
  group: update-alacritty-cask
  cancel-in-progress: false

jobs:
  check:
    name: Check latest release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      branch: ${{ steps.release.outputs.branch }}
      recreate: ${{ steps.decision.outputs.recreate }}
      sha256: ${{ steps.release.outputs.sha256 }}
      should_update: ${{ steps.decision.outputs.should_update }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Get latest release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_REPOSITORY: alacritty/alacritty
        run: |
          set -euo pipefail

          release="$(
            gh release view \
              --repo "${UPSTREAM_REPOSITORY}" \
              --json assets,tagName
          )"
          tag="$(jq -r '.tagName' <<<"${release}")"

          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected release tag: ${tag}"
            exit 1
          fi

          version="${tag#v}"
          asset="Alacritty-v${version}.dmg"
          mapfile -t digests < <(
            jq -r --arg asset "${asset}" \
              '.assets[] | select(.name == $asset) | .digest' \
              <<<"${release}"
          )

          if (( ${#digests[@]} != 1 )); then
            echo "::error::Expected exactly one ${asset} release asset"
            exit 1
          fi

          digest="${digests[0]}"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Invalid SHA-256 digest for ${asset}"
            exit 1
          fi

          {
            echo "version=${version}"
            echo "sha256=${digest#sha256:}"
            echo "branch=automation/update-alacritty-${version}"
          } >>"${GITHUB_OUTPUT}"

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check current cask version
        id: cask
        shell: bash
        env:
          CASK_FILE: Casks/alacritty.rb
          SHA256: ${{ steps.release.outputs.sha256 }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          current_version="$(sed -nE 's/^  version "([^"]+)"$/\1/p' "${CASK_FILE}")"
          current_sha256="$(sed -nE 's/^  sha256 "([0-9a-f]{64})"$/\1/p' "${CASK_FILE}")"
          if [[ -z "${current_version}" || -z "${current_sha256}" ]]; then
            echo "::error::Could not read the current Alacritty version and digest"
            exit 1
          fi

          if [[ "${current_version}" == "${VERSION}" ]]; then
            if [[ "${current_sha256}" != "${SHA256}" ]]; then
              echo "::error::The digest changed for the existing Alacritty ${VERSION} release"
              exit 1
            fi

            echo "matches=true" >>"${GITHUB_OUTPUT}"
            echo "Alacritty ${VERSION} is already current."
          else
            echo "matches=false" >>"${GITHUB_OUTPUT}"
            echo "Alacritty ${current_version} can be updated to ${VERSION}."
          fi

      - name: Check automated pull request
        id: pull_request
        shell: bash
        env:
          BRANCH: ${{ steps.release.outputs.branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          pull_request="$(
            gh pr list \
              --repo "${GITHUB_REPOSITORY}" \
              --head "${BRANCH}" \
              --state all \
              --limit 1 \
              --json state,url \
              --jq '.[0] // {}'
          )"

          state="$(jq -r '.state // "NONE"' <<<"${pull_request}")"
          url="$(jq -r '.url // empty' <<<"${pull_request}")"

          echo "state=${state}" >>"${GITHUB_OUTPUT}"
          if [[ "${state}" == "NONE" ]]; then
            echo "No automated pull request exists."
          else
            echo "Automated pull request is ${state}: ${url}"
          fi

      - name: Decide whether to update
        id: decision
        shell: bash
        env:
          CURRENT: ${{ steps.cask.outputs.matches }}
          PR_STATE: ${{ steps.pull_request.outputs.state }}
        run: |
          set -euo pipefail

          recreate=false
          should_update=false

          if [[ "${CURRENT}" == "true" ]]; then
            echo "The cask is already current; no update is needed."
          else
            case "${PR_STATE}" in
              NONE)
                should_update=true
                ;;
              OPEN)
                echo "The automated pull request is still open."
                ;;
              MERGED)
                echo "The automated pull request was already merged."
                ;;
              CLOSED)
                recreate=true
                should_update=true
                echo "The discarded pull request will be recreated."
                ;;
              *)
                echo "::error::Unexpected pull request state: ${PR_STATE}"
                exit 1
                ;;
            esac
          fi

          {
            echo "recreate=${recreate}"
            echo "should_update=${should_update}"
          } >>"${GITHUB_OUTPUT}"

  update:
    name: Update cask and open pull request
    needs: check
    if: ${{ needs.check.outputs.should_update == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    env:
      BRANCH: ${{ needs.check.outputs.branch }}
      CASK_FILE: Casks/alacritty.rb
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SHA256: ${{ needs.check.outputs.sha256 }}
      VERSION: ${{ needs.check.outputs.version }}

    steps:
      - name: Delete discarded pull request branch
        if: ${{ needs.check.outputs.recreate == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          get_ref="repos/${GITHUB_REPOSITORY}/git/ref/heads/${BRANCH}"
          delete_ref="repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}"
          if gh api --silent "${get_ref}" 2>/dev/null; then
            gh api --method DELETE "${delete_ref}"
            echo "Deleted ${BRANCH}."
          else
            echo "Branch ${BRANCH} was already deleted."
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Update cask
        id: update
        shell: bash
        run: |
          set -euo pipefail

          current_version="$(sed -nE 's/^  version "([^"]+)"$/\1/p' "${CASK_FILE}")"
          current_sha256="$(sed -nE 's/^  sha256 "([0-9a-f]{64})"$/\1/p' "${CASK_FILE}")"

          if [[ "${current_version}" == "${VERSION}" ]]; then
            if [[ "${current_sha256}" != "${SHA256}" ]]; then
              echo "::error::The digest changed for the existing Alacritty ${VERSION} release"
              exit 1
            fi

            echo "changed=false" >>"${GITHUB_OUTPUT}"
            echo "Alacritty ${VERSION} is already current."
          else
            sed -i -E \
              -e "s/^  version \"[^\"]+\"$/  version \"${VERSION}\"/" \
              -e "s/^  sha256 \"[0-9a-f]{64}\"$/  sha256 \"${SHA256}\"/" \
              "${CASK_FILE}"

            if ! grep -Fqx "  version \"${VERSION}\"" "${CASK_FILE}" || \
               ! grep -Fqx "  sha256 \"${SHA256}\"" "${CASK_FILE}"; then
              echo "::error::Could not update ${CASK_FILE}"
              exit 1
            fi

            git diff --check
            echo "changed=true" >>"${GITHUB_OUTPUT}"
          fi

      - name: Create verified commit
        if: ${{ steps.update.outputs.changed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          git switch --create "${BRANCH}"
          git push --force-with-lease --set-upstream origin "${BRANCH}"

          head="$(git rev-parse HEAD)"
          contents="$(base64 < "${CASK_FILE}" | tr -d '\n')"
          # GraphQL variables must remain literal for GitHub to expand them.
          # shellcheck disable=SC2016
          mutation='mutation(
            $repository: String!
            $branch: String!
            $head: GitObjectID!
            $message: String!
            $path: String!
            $contents: Base64String!
          ) {
            createCommitOnBranch(
              input: {
                branch: {
                  repositoryNameWithOwner: $repository
                  branchName: $branch
                }
                expectedHeadOid: $head
                message: { headline: $message }
                fileChanges: {
                  additions: [{ path: $path, contents: $contents }]
                }
              }
            ) {
              commit {
                url
              }
            }
          }'

          gh api graphql \
            --raw-field query="${mutation}" \
            --raw-field repository="${GITHUB_REPOSITORY}" \
            --raw-field branch="${BRANCH}" \
            --raw-field head="${head}" \
            --raw-field message="Update Alacritty to ${VERSION}" \
            --raw-field path="${CASK_FILE}" \
            --raw-field contents="${contents}" \
            --jq '.data.createCommitOnBranch.commit.url'

      - name: Open pull request
        if: ${{ steps.update.outputs.changed == 'true' }}
        shell: bash
        run: |
          gh pr create \
            --repo "${GITHUB_REPOSITORY}" \
            --base "${{ github.event.repository.default_branch }}" \
            --head "${BRANCH}" \
            --title "Update Alacritty to ${VERSION}" \
            --body "Automated update from the upstream Alacritty v${VERSION} release."
